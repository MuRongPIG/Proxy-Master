name: Proxy Benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run proxy scraper
        run: python getproxy.py
      - name: Run proxy benchmark
        run: python proxy_benchmark.py
      - name: Upload proxy lists
        uses: actions/upload-artifact@v4
        with:
          name: proxy-lists
          path: |
            Output/MBProxies.txt
            Output/MBProxiesAll.txt
            Output/proxy_benchmark_results.csv
      - name: Commit updated proxy lists
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add Output/MBProxies.txt Output/MBProxiesAll.txt Output/proxy_benchmark_results.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "Update proxy lists"
          git push