name: Get Proxy Task

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours

permissions:
  contents: write

concurrency:
  group: getproxy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # Shallow clone
          ref: main
          path: .
          sparse-checkout: false
          set-safe-directory: true
          persist-credentials: true

      - name: Setup git
        run: |
          git config pull.rebase false
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Get proxies
        run: python getproxy.py

      - name: List output files
        run: |
          ls -lh http.txt socks4.txt socks5.txt ProxyList.csv || true
          head -n 5 ProxyList.csv || true

      - name: Git status before commit
        run: git status

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add http.txt socks4.txt socks5.txt ProxyList.csv
          git status
          git diff --cached --quiet || git commit -m "Update proxies ($(date '+%F %H:%M %Z'))"

      - name: Git status after commit
        run: git status

      - name: Push changes
        run: |
          # Always attempt to push since we know we have changes
          git push origin main --force
