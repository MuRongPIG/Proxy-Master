name: Get Proxy Task

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: getproxy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Get proxies
        run: python getproxy.py

      - name: Commit changes if any
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add http.txt socks4.txt socks5.txt ProxyList.csv TestProxySheet.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update proxies ($(date '+%F %H:%M %Z'))"

      - name: Sync branch before push
        run: |
          set -e
          git fetch origin main
          git rebase origin/main || { git rebase --abort || true; git pull --rebase origin main; }

      - name: Push changes
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          force_with_lease: true
