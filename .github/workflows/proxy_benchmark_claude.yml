name: Proxy Benchmark Claude

on:
  schedule:
    - cron: '0 */6 * * *'  # Run every 6 hours
  workflow_dispatch:  # Allow manual triggers

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # 1 hour timeout

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install aiohttp tqdm
        
    - name: Run proxy scraper
      run: python getproxy.py
        
    - name: Run proxy benchmark
      run: python proxy_benchmark.py
        
    - name: Upload proxy lists
      uses: actions/upload-artifact@v3
      with:
        name: proxy-lists
        path: |
          Output/MBProxies.txt
          Output/MBProxiesAll.txt
          Output/proxy_benchmark_results.csv
          
    - name: Commit updated proxy lists
      run: |
        git config --global user.name 'GitHub Action'
        git config --global user.email 'action@github.com'
        git add Output/MBProxies.txt Output/MBProxiesAll.txt Output/proxy_benchmark_results.csv
        git diff --quiet && git diff --staged --quiet || git commit -m "Update proxy lists"
        git push
