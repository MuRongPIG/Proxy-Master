name: benchmark proxies

on:
  workflow_dispatch:
    inputs:
      workers:
        description: "Number of concurrent threads"
        required: false
        default: "256"
  schedule:
    - cron: "15 */8 * * *"  # staggered from collection

permissions:
  contents: write

concurrency:
  group: proxy-master-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Setup Python
        uses: actions/setup-python@v5
        with: { python-version: "3.10" }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Benchmark proxies
        run: python proxy_benchmark.py ${{ github.event.inputs.workers }}

      - name: Commit benchmark artifacts
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Output/ *_checked.txt 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Benchmark results ($(date '+%F %H:%M %Z'))"

      - name: Sync branch before push
        run: |
          git fetch origin main
          git rebase origin/main || { git rebase --abort || true; git pull --rebase origin main; }

      - name: Push changes
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          force_with_lease: true
