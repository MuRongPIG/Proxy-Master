name: Proxy Task

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "getproxy or benchmark"
        required: true
        default: "benchmark"
        type: choice
        options: [benchmark, getproxy]
      workers:
        description: "Concurrent threads (benchmark only)"
        required: false
        default: "512"
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      workers:
        required: false
        type: string
    secrets: {}  # inherit in caller

permissions:
  contents: write

concurrency:
  group: proxy-task-${{ github.ref }}-${{ inputs.mode || github.event.inputs.mode }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      MODE: ${{ inputs.mode || github.event.inputs.mode || 'benchmark' }}
      WORKERS: ${{ inputs.workers || github.event.inputs.workers || '512' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Setup Python
        uses: actions/setup-python@v5
        with: { python-version: "3.10" }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run task
        run: |
          if [ "$MODE" = "getproxy" ]; then
            python getproxy.py
          else
            python proxy_benchmark.py "$WORKERS"
          fi

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Output/ *_checked.txt 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Results ($(date '+%F %H:%M %Z'))"

      - name: Sync and push
        run: |
          set -e
          git fetch origin main
          git rebase origin/main || { git rebase --abort || true; git pull --rebase origin main; }
          git push --force-with-lease
